spring.application.name=pfe-backend

spring.datasource.url=jdbc:postgresql://localhost:5433/pfe_db
spring.datasource.username=pfe
spring.datasource.password=pfe

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Bascule Flyway (etape 2.21, ENF-30). La base de dev existante a deja ce
# schema (cree via ddl-auto=update) : baseline-on-migrate enregistre la
# version 1 comme deja appliquee sans rejouer V1__init.sql.
#
# ddl-auto est repasse sur "validate" a l'etape 3.14 (lot 3) : V2__jalons.sql
# est desormais la seule source de verite pour la table etape. Important :
# contrairement a V1 (couverte par le baseline), V2 sera reellement executee
# au prochain demarrage. Comme la table etape existe deja localement (creee
# via ddl-auto=update pendant le dev/tests du lot 3), il faut la supprimer
# avant de relancer, sinon Flyway echoue sur "relation etape already exists" :
#   DROP TABLE etape;
# (donnees de test uniquement, aucune perte reelle)
#
# ddl-auto repasse sur "validate" a l'etape 4.12 (lot 4) : V3__documents.sql
# est desormais la seule source de verite pour les tables document et
# commentaire. Comme ces tables existent deja localement (creees via
# ddl-auto=update pendant le dev/tests du lot 4), il faut les supprimer avant
# de relancer, sinon Flyway echoue sur "relation ... already exists" :
#   DROP TABLE commentaire;
#   DROP TABLE document;
# (donnees de test uniquement, aucune perte reelle ; commentaire avant
# document car commentaire a une FK vers document)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=init

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# MinIO (Lot 4). Credentials et port alignes sur docker-compose.yml (service minio).
minio.endpoint=http://localhost:9000
minio.access-key=minio
minio.secret-key=minio12345
minio.bucket=pfe-documents

server.port=8081

jwt.secret=${JWT_SECRET:changeMoiEnDevSeulement32CaracteresMinimum}
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

app.cors.origines=http://localhost:5173,http://127.0.0.1:5173

management.endpoints.web.exposure.include=health,info
