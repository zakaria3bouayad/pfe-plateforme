spring.application.name=pfe-backend

# Profil "local" actif par defaut (Lot 6, etape 6.3) : charge
# application-local.properties, non versionne, qui porte les secrets de la
# machine de developpement (cle API Gemini). Surchargeable par la variable
# d'environnement SPRING_PROFILES_ACTIVE pour un autre environnement.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=jdbc:postgresql://localhost:5433/pfe_db
spring.datasource.username=pfe
spring.datasource.password=pfe


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Bascule Flyway (etape 2.21, ENF-30). La base de dev existante a deja ce
# schema (cree via ddl-auto=update) : baseline-on-migrate enregistre la
# version 1 comme deja appliquee sans rejouer V1__init.sql.
#
# ddl-auto est repasse sur "validate" a l'etape 3.14 (lot 3) : V2__jalons.sql
# est desormais la seule source de verite pour la table etape. Important :
# contrairement a V1 (couverte par le baseline), V2 sera reellement executee
# au prochain demarrage. Comme la table etape existe deja localement (creee
# via ddl-auto=update pendant le dev/tests du lot 3), il faut la supprimer
# avant de relancer, sinon Flyway echoue sur "relation etape already exists" :
#   DROP TABLE etape;
# (donnees de test uniquement, aucune perte reelle)
#
# ddl-auto repasse sur "validate" a l'etape 4.12 (lot 4) : V3__documents.sql
# est desormais la seule source de verite pour les tables document et
# commentaire. Comme ces tables existent deja localement (creees via
# ddl-auto=update pendant le dev/tests du lot 4), il faut les supprimer avant
# de relancer, sinon Flyway echoue sur "relation ... already exists" :
#   DROP TABLE commentaire;
#   DROP TABLE document;
# (donnees de test uniquement, aucune perte reelle ; commentaire avant
# document car commentaire a une FK vers document)
#
# ddl-auto repasse sur "validate" a l'etape 5.11 (lot 5) : V4__messagerie_ressources.sql
# est desormais la seule source de verite pour les tables message et
# ressource. Comme ces tables existent deja localement (creees via
# ddl-auto=update pendant le dev/tests du lot 5), il faut les supprimer avant
# de relancer, sinon Flyway echoue sur "relation ... already exists" :
#   DROP TABLE message;
#   DROP TABLE ressource;
# (donnees de test uniquement, aucune perte reelle)
#
# ddl-auto repasse sur "validate" a l'etape 6.10 (lot 6) :
# V5__similarite.sql est desormais la seule source de verite pour les colonnes
# d'archivage de la table document et pour les tables indexation_document,
# morceau_document, rapport_similarite et correspondance_similarite. Ces
# objets existant deja localement (crees via ddl-auto=update pendant le dev du
# lot 6), il faut les supprimer avant de relancer, sinon Flyway echoue sur
# "relation ... already exists" :
#   DROP TABLE correspondance_similarite;
#   DROP TABLE rapport_similarite;
#   DROP TABLE morceau_document;
#   DROP TABLE indexation_document;
#   ALTER TABLE document DROP COLUMN archive, DROP COLUMN date_archivage, DROP COLUMN archive_par_id;
# (ordre impose par les cles etrangeres ; donnees de test uniquement, mais le
# corpus archive et les rapports produits sont perdus - il faudra rearchiver
# puis relancer les analyses)
#
# ddl-auto repasse sur "validate" a l'etape 7.15 (lot 7) : V6__notifications_audit.sql
# est desormais la seule source de verite pour les tables notification et
# entree_audit. Comme ces tables existent deja localement (creees via
# ddl-auto=update pendant le dev du lot 7), il faut les supprimer avant de
# relancer, sinon Flyway echoue sur "relation ... already exists" :
#   DROP TABLE entree_audit;
#   DROP TABLE notification;
# (donnees de test uniquement, aucune perte reelle)
#
# Etape 6.3 : l'extension pgvector est activee par le callback Flyway
# db/migration/beforeMigrate.sql, execute a chaque demarrage avant les
# migrations. Aucune commande manuelle n'est donc requise, ni ici ni sur une
# machine qui clone le depot.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=init

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Mail (Lot 7, etape 7.3), sur MailHog (docker-compose, service "mailhog") :
# serveur SMTP de developpement sans authentification, les mails atterrissent
# dans son interface web (http://localhost:8025) pour la demo au lieu de
# partir reellement. Decision assumee (docs/10.md).
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
mail.expediteur=noreply@pfe-backend.local

# MinIO (Lot 4). Credentials et port alignes sur docker-compose.yml (service minio).
minio.endpoint=http://localhost:9000
minio.access-key=minio
minio.secret-key=minio12345
minio.bucket=pfe-documents

server.port=8081

jwt.secret=${JWT_SECRET:changeMoiEnDevSeulement32CaracteresMinimum}
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# Redis (Lot 5, bloc C). Port aligne sur docker-compose.yml (service redis).
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Detection de similarite (Lot 6). Longueur maximale de texte conservee par
# document apres extraction PDFBox : au-dela, le texte est tronque et
# l'indexation le signale (champ "tronque"). Ordre de grandeur : un rapport
# de PFE de 100 pages tourne autour de 200 000 caracteres.
similarite.texte.longueur-max=1000000

# API d'embeddings Google Gemini (Lot 6, etape 6.3).
# La cle n'est PAS ici : elle vit dans application-local.properties (non
# versionne) ou, a defaut, dans la variable d'environnement GEMINI_API_KEY.
# Toute valeur en clair dans ce fichier finirait dans le depot Git.
gemini.api-key=${GEMINI_API_KEY:}
gemini.embeddings.url=https://generativelanguage.googleapis.com/v1beta/models

# gemini-embedding-2 : fenetre de 8192 tokens (contre 2048 pour
# gemini-embedding-001) et renormalisation automatique des vecteurs
# tronques, indispensable pour un cosinus correct en 768 dimensions.
gemini.embeddings.modele=gemini-embedding-2

# Dimension du vecteur. DOIT rester alignee sur MorceauDocument.DIMENSION et
# sur la colonne vector(768) : en changer impose de reindexer tout le corpus,
# les vecteurs de dimensions differentes n'etant pas comparables.
gemini.embeddings.dimension=768

# Ce modele agrege les entrees multiples en un seul vecteur : impossible de
# grouper les morceaux en un appel, il en faut un par morceau. La pause
# maintient le debit sous le quota du palier gratuit.
gemini.embeddings.pause-ms=250
gemini.embeddings.timeout-secondes=60

# Decoupage du texte avant vectorisation. Morceau plus court = detection plus
# fine d'un passage recopie, mais davantage d'appels a l'API. Le
# chevauchement evite qu'un passage a cheval sur deux morceaux soit coupe en
# deux moities dont aucune ne ressemble a l'original.
#
# LIMITE CONNUE (mesuree a l'etape 6.6) : a 6000 caracteres, un morceau
# melange le passage recopie et du texte original, ce qui rabaisse le score.
# Le plagiat du jeu d'essai portant sur quatre sections entieres, il ressort
# malgre tout a 0,9124 ; un plagiat plus localise - un seul paragraphe repris
# dans deux pages de texte propre - serait dilue et pourrait passer sous le
# seuil. Reduire cette valeur a 2500 corrigerait le point, au prix d'environ
# 2,5 fois plus d'appels a l'API par document. Non retenu a ce stade.
similarite.morceau.longueur=6000
similarite.morceau.chevauchement=600

# Seuils de verdict (etape 6.4). Ce sont des similarites cosinus dans [0,1],
# PAS des pourcentages de mots communs : la mesure porte sur le sens, pas sur
# le vocabulaire. D'ou des seuils bien plus hauts que ceux d'un outil de
# detection lexicale, ou 80 % de mots communs signalerait une copie flagrante.
#
# CALIBRAGE MESURE (etape 6.6, jeu d'essai docs/pdf-test) :
#   rapport-B-suspect.pdf   0,9124  -> 4 sections recopiees mot pour mot de A
#   rapport-C-sans-lien.pdf 0,7773  -> aucun lien thematique avec A
#
# Le score de C est le resultat le plus instructif : deux rapports sans rien
# de commun sur le fond atteignent deja 0,78, du seul fait d'etre tous deux
# des rapports de PFE en francais, de registre academique. C'est le plancher
# de bruit de la mesure, pas un signal.
#
#   >= 0,90 : proximite difficilement fortuite (SUSPECT)
#   >= 0,85 : a verifier (ATTENTION)
#
# ATTENTION releve a 0,85 et non 0,80 : C est un cas hors domaine, alors que
# deux rapports d'informatique tous deux originaux partagent en plus le
# vocabulaire technique et monteraient vers 0,83-0,86. A 0,80 la liste des
# cas a examiner se remplirait de faux positifs, et une liste ou l'encadrant
# ne trouve jamais rien cesse d'etre consultee.
similarite.seuil.suspect=0.90
similarite.seuil.attention=0.85

# Nombre de voisins remontes par morceau analyse. Superieur au nombre
# d'archives attendues dans la reponse : plusieurs morceaux d'une meme
# archive peuvent occuper les premieres places.
similarite.voisins-par-morceau=10

# En dessous de ce score, une correspondance n'apprend rien et n'est pas
# conservee. La meilleure est toujours gardee, meme sous ce plancher, pour
# qu'un rapport ne soit jamais vide.
similarite.score-minimum-conserve=0.60

app.cors.origines=http://localhost:5173,http://127.0.0.1:5173

management.endpoints.web.exposure.include=health,info
