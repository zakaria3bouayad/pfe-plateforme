# Infrastructure locale de la plateforme PFE.
# Demarrage : docker compose up -d
#
# name: pfe -> fige le nom du projet Docker, donc celui des volumes
# (pfe_pgdata). Les donnees existantes sont ainsi conservees malgre le
# deplacement du dossier.

name: pfe

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pfe-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pfe_db
      POSTGRES_USER: pfe
      POSTGRES_PASSWORD: pfe
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfe -d pfe_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pfe-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  minio:
    image: minio/minio
    container_name: pfe-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  redisdata:
  miniodata:
